site_name: chora
site_description: chora is the space where forms appear. A Wayland compositor without policy.
site_url: https://marpogaus.github.io/chora/
repo_url: https://github.com/MArpogaus/chora
docs_dir: docs
# a link to a page that moved is only a log line otherwise
strict: true
exclude_docs: |
  requirements.txt

theme:
  name: material
  features: [navigation.sections, navigation.top, content.code.copy, toc.follow]
  palette:
  - scheme: default
    toggle: {icon: material/brightness-7, name: dark mode}
  - scheme: slate
    toggle: {icon: material/brightness-4, name: light mode}

nav:
- Home: index.md
- Concept:
  - Vision and principles: vision.md
  - Glossary: glossary.md
  - Scenarios: scenarios.md
- Design:
  - Architecture: architecture.md
  - API: api.md
  - Configuration: configuration.md
  - chora-mc style guide: mc-style.md
  - chora-construct style guide: construct-style.md
  - Project structure: project-structure.md
  - Voice agent (draft): voice.md
- Context:
  - Dependencies: dependencies.md
  - Alternatives: alternatives.md
  - Decisions: decisions.md
  - Roadmap: roadmap.md

markdown_extensions:
- admonition
- toc: {permalink: true}
- pymdownx.snippets
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version: {provider: mike}
