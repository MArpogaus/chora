# chora-xp rasterizes its theme at runtime, and the core decodes PNG files:
# unoptimized image, font and SVG crates take seconds per start in debug
# builds. These crates build optimized in every profile.
[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.fontdb]
opt-level = 3

[profile.dev.package.harfrust]
opt-level = 3

[profile.dev.package.kurbo]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.read-fonts]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.roxmltree]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.skrifa]
opt-level = 3

[profile.dev.package.svgtypes]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.tiny-skia-path]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
lto = "thin"

[workspace]
members = ["crates/*", "plugins/*", "tests/probe"]
resolver = "3"

[workspace.dependencies]
base64 = "0.23"
calloop = { version = "0.14", features = ["signals"] }
chora-kit = { path = "crates/chora-kit" }
chora-scene = { path = "crates/chora-scene" }
clap = { version = "4", features = ["derive"] }
cosmic-text = "0.19"
imbl = "7"
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3"

[workspace.dependencies.smithay]
default-features = false
features = [
  "backend_drm",
  "backend_gbm",
  "backend_libinput",
  "backend_session_libseat",
  "backend_udev",
  "backend_winit",
  "desktop",
  "renderer_multi",
  "wayland_frontend"
]
git = "https://github.com/Smithay/smithay"
rev = "cf43a02acd6b5863909665c67f289f6f3478823a"

# The same revision as smithay.
[workspace.dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "cf43a02acd6b5863909665c67f289f6f3478823a"

[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/MArpogaus/chora"
rust-version = "1.89"
version = "0.7.0-rc.3"
