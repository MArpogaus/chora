[profile.release]
lto = "thin"

[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.dependencies]
chora-scene = { path = "crates/chora-scene" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.dependencies.smithay]
default-features = false
features = ["backend_drm", "backend_winit", "desktop", "wayland_frontend"]
git = "https://github.com/Smithay/smithay"
rev = "cf43a02acd6b5863909665c67f289f6f3478823a"

[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/MArpogaus/void"
rust-version = "1.87"
version = "0.0.0"
