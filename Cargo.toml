[profile.release]
lto = "thin"

[workspace]
members = ["crates/*", "plugins/*"]
resolver = "3"

[workspace.dependencies]
chora-scene = { path = "crates/chora-scene" }

[workspace.lints.clippy]
cognitive_complexity = "warn"
excessive_nesting = "warn"
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MArpogaus/void"
rust-version = "1.87"
version = "0.0.0"
