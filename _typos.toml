# Settings of the typos hook. Run: typos

[default.extend-words]
abd = "abd"
ags = "ags"
# German words of the voice phrases, word lists and docs.
alle = "alle"
# The start of a commit hash in the plan reports.
ba = "ba"
# A Latin-1 "café" in a test of the read tool.
caf = "caf"
# A deliberate misspelling in the tests of the event names.
creatd = "creatd"
dokument = "dokument"
ein = "ein"
ende = "ende"
habe = "habe"
ist = "ist"
# Pixel box names in the icon code (iy), and PNGs split at the s (pn).
iy = "iy"
# Level of detail of the construct panes.
lod = "lod"
oder = "oder"
offen = "offen"
oktober = "oktober"
pn = "pn"
programm = "programm"
stopp = "stopp"
termine = "termine"
ue = "ue"  # the transliteration of the umlaut u
vor = "vor"
# The WebAssembly interface language, and the GTK shell of Aylur.
wit = "wit"

[files]
extend-exclude = [
  # The German logs of one overnight run, kept as a record.
  "tests/battle/reviews/",
  # The theme of the XP flavor stays as upstream.
  "flavors/xp/theme/"
]
