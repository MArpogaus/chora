# cargo-deny: licenses, advisories, bans and sources of the dependencies.
# The license list keeps GPL-3.0-only crates out of the GPL-3.0-or-later core.

[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
allow-wildcard-paths = true
multiple-versions = "allow"
wildcards = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib"
]

[sources]
allow-git = ["https://github.com/Smithay/smithay"]
unknown-git = "deny"
unknown-registry = "deny"
