# Activate in a fresh clone with:
#   pre-commit install --install-hooks -t pre-commit -t commit-msg
# Rust hooks (rustfmt, clippy) join once the first crate lands.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-toml
  - id: check-yaml
    # syntax-only: mkdocs.yml needs the !!python/name mermaid-fence tag
    args: [--unsafe]
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace

- repo: https://github.com/codespell-project/codespell
  rev: v2.4.3
  hooks:
  # WIT: the WebAssembly Interface Type language; AGS: the Aylur's GTK Shell
  - id: codespell
    args: [-L, 'wit,ags']

- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.0
  hooks:
  - id: commitizen   # conventional-commit message check
    stages: [commit-msg]
