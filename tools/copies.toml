# Copies of mechanisms that moved to a shared part (tools/cut-check, check
# "copies"). Per row: a regex, the path prefixes that may hold it, and the
# count of matching lines allowed elsewhere. A count only falls; at 0 the
# row blocks. `paths` limits the scan (default: crates, plugins, services).

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "surface-created filter"
pattern = 'to != NAME'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "Event::SurfaceCreated outside kit"
paths = ["plugins", "services"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "tiling: surface-created filter (WM1)"
paths = ["plugins/chora-tiling"]
pattern = 'to != NAME'

[[row]]
max = 0
name = "tiling: Event::SurfaceCreated (WM1)"
paths = ["plugins/chora-tiling"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "mc: Event::SurfaceCreated (WM1b)"
paths = ["plugins/chora-mc"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "construct: Event::SurfaceCreated (WM1c)"
paths = ["plugins/chora-construct"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "xp: Event::SurfaceCreated (WM1d)"
paths = ["plugins/chora-xp"]
pattern = 'Event::SurfaceCreated\b'

# kit::ask::ANSWER_METHOD names the method; voice and the assistant use it.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "confirm.answer"
pattern = '"confirm\.answer"'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "fn language"
pattern = 'fn language\b'

[[row]]
allow = ["crates/chora-scene/", "crates/chora-kit/"]
max = 0
name = "XDG_RUNTIME_DIR (KIT1)"
pattern = 'XDG_RUNTIME_DIR'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "LC_ALL (KIT1)"
pattern = 'LC_ALL'

# COPIES-0: the cells of a plugin connect to kit testing::FakeCore (with
# `respond`, `record` and `hold` for what a cell plants), not to a socket of
# its own.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "UnixListener::bind in plugin tests"
paths = ["plugins"]
pattern = 'UnixListener::bind'

# FOCUS-PORT (WM2b): the looks hand focus through kit::wm::focus. Allowed:
# chora-scene defines and applies the command, core ipc checks who may
# send it, kit testing records it in the FakeCore, kit wm builds it.
[[row]]
allow = [
  "crates/chora-kit/src/wm",
  "crates/chora-kit/tests/wm_",
  "crates/chora-kit/src/testing.rs",
  "crates/chora-scene/",
  "crates/chora/src/ipc/"
]
max = 0
name = "Command::Focus outside kit::wm"
pattern = 'Command::Focus\b'

# WM2: kit::wm::focus holds the focus of a look; tiling and mc moved.
[[row]]
max = 0
name = "own focus model (ShownFocus, WM2)"
paths = ["plugins"]
pattern = '\bShownFocus\b'

[[row]]
max = 0
name = "mc: Command::Focus (WM2)"
paths = ["plugins/chora-mc"]
pattern = 'Command::Focus\b'

[[row]]
max = 0
name = "tiling: Command::Focus (WM2)"
paths = ["plugins/chora-tiling"]
pattern = 'Command::Focus\b'

# The core (crates/chora) emits the event and is outside `paths`; kit
# wm::focus reads it and kit testing builds it for the cells of the looks.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "Event::FocusChanged outside kit"
paths = ["plugins", "services"]
pattern = 'Event::FocusChanged\b'

# kit4: kit::ask is the only question model; mc and construct draw its card.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own question event model (Confirm, Keys)"
paths = ["plugins"]
pattern = '^\s*(pub )?struct (Confirm|Keys)\b'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "question buttons as literal Ja/Nein"
paths = ["plugins"]
pattern = '"(Ja|Nein)"'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own key cap of a question (cap, show_key copy)"
pattern = 'fn cap\(key: &str\)'

# wm3: kit::wm::open is the only list of the open shell surfaces; a look
# builds no open entry by hand (a cell takes it from `Surface::entry`) and
# keeps no flag for its key list.
[[row]]
max = 0
name = "open entry of state.get built by hand (WM3)"
paths = ["plugins"]
pattern = 'json!\(\[\{"id": "[a-z-]+", "kind"'

[[row]]
max = 0
name = "tiling: keys_open flag (WM3)"
paths = ["plugins/chora-tiling"]
pattern = 'keys_open: bool'

# WM5: the core orders the root groups by `order` (D89); no look moves its
# root below the others at each build any more (D83 retired).
[[row]]
max = 0
name = "root moved below the other roots by hand (D83)"
paths = ["plugins", "services"]
pattern = 'fn under_other_plugins|Order::Lock'

[[row]]
allow = ["plugins/chora-notify/"]
max = 0
name = "notice: a client of org.freedesktop.Notifications outside chora-notify (KIT5)"
pattern = 'org\.freedesktop\.Notifications'

[[row]]
max = 0
name = "notice: zbus in chora-kit (KIT5)"
paths = ["crates/chora-kit"]
pattern = '\bzbus\b'

[[row]]
max = 0
name = "mc: its own stack of notifications, a column and an urgent line (KIT5)"
paths = ["plugins/chora-mc"]
pattern = 'NOTIFY_LINES|URGENT_WORD|urgent:clear|const (NOTIFY|URGENT)\b'

[[row]]
max = 0
name = "construct-notice: a notice that construct draws itself (KIT5)"
paths = ["plugins/chora-construct"]
pattern = 'construct-notice'

[[row]]
max = 0
name = "tiling: notify-send (KIT5)"
paths = ["plugins/chora-tiling"]
pattern = 'notify-send'

[[row]]
max = 0
name = "tiling: mako (KIT5)"
paths = ["plugins/chora-tiling"]
pattern = 'mako'

# kit6: kit::launch owns the start of a program and its end (D104); a
# plugin starts through it and keeps no token variable, pidfd or status file.
[[row]]
allow = ["crates/chora-kit/", "crates/choractl/"]
max = 0
name = "choractl run token variable (KIT6)"
pattern = 'CHORA_RUN_TOKEN'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own end-of-program tracking (pidfd, status file) (KIT6)"
pattern = 'pidfd_open|chora-xp-exit|chora-launch-exit|struct StatusFile'

# kit2c: tiling binds the actions that every look has through kit::actions;
# its own enum keeps the windows, the layouts and the tags.
[[row]]
max = 0
name = "tiling: a shared action of its own (KIT2c)"
paths = ["plugins/chora-tiling"]
pattern = 'Action::(Run|Close|Give|Drag|Volume|ShowKeys)\b'

# kit3: kit::keysheet gives the words of a shared action and the spelling of
# a key (one table, KIT3); a look names only its own actions and draws
# its own costume.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own words of a shared action in a key list (KIT3)"
pattern = 'System::(Lock|Power|Screenshot|Chat|Keys)\) => (\[|")[A-Z]|Volume\(Change::(Up|Down|Mute)\)\) => (\[|")[A-Z]'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own spelling of a key in a key list (KIT3)"
pattern = '"(Escape|slash|space|period|BTN_LEFT|XF86AudioRaiseVolume)" => "[^"]*"\.(to_owned|to_string|into)\(\)'

[[row]]
max = 0
name = "own order of the volume keys in a key list (KIT3)"
pattern = 'fn volume_order'

# kit2d: xp takes its keys from `bindings` (kit::actions); no table of keys
# and no enum of key actions of its own.
[[row]]
max = 0
name = "xp: table of hard-coded keys (KIT2d)"
paths = ["plugins/chora-xp"]
pattern = 'const KEYS: \['

[[row]]
max = 0
name = "xp: own enum of key actions (KIT2d)"
paths = ["plugins/chora-xp"]
pattern = 'pub enum Key \{'

# COPIES-0: one `on_path` (kit desktop_entry); the stub of a PATH in the
# tests of kit launcher is deliberate: it names the programs that the test
# says are installed, and reads no PATH.
[[row]]
allow = ["crates/chora-kit/src/desktop_entry.rs", "crates/chora-kit/src/launcher.rs"]
max = 0
name = "own on_path (a second look at PATH)"
pattern = 'fn on_path\b'

# Test folders come from one counted helper (name, pid, counter; removed on
# drop): chora_scene::testing::TempDir, re-exported by the kit as
# chora_kit::testing::TempDir. What is left outside is counted PNG and socket
# helpers that hand a file path on, and may only fall.
[[row]]
allow = ["crates/chora-scene/src/testing.rs"]
max = 0
name = "temp folder by pid outside the counted helper"
pattern = 'temp_dir\(\)\s*\.join\(format!\(.*process::id'

[[row]]
max = 0
name = "own report()"
paths = ["plugins"]
pattern = 'fn report\b'

# One way for a test to connect: `FakeCore::runtime` (kit testing). The
# inline `Runtime::with(core.connect(..), ..)` needed an allow per test.
[[row]]
max = 0
name = "own test connect (Runtime::with in a plugin)"
paths = ["plugins"]
pattern = 'Runtime::with\('
