# Copies of mechanisms that moved to a shared part (tools/cut-check, check
# "copies"). Per row: a regex, the path prefixes that may hold it, and the
# count of matching lines allowed elsewhere. A count only falls; at 0 the
# row blocks. `paths` limits the scan (default: crates, plugins, services).

[[row]]
allow = ["crates/chora-kit/"]
max = 1
name = "surface-created filter"
pattern = 'to != NAME'

[[row]]
allow = ["crates/chora-kit/"]
max = 1
name = "Event::SurfaceCreated outside kit"
paths = ["plugins", "services"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "tiling: surface-created filter (WM1)"
paths = ["plugins/chora-tiling"]
pattern = 'to != NAME'

[[row]]
max = 0
name = "tiling: Event::SurfaceCreated (WM1)"
paths = ["plugins/chora-tiling"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "mc: Event::SurfaceCreated (WM1b)"
paths = ["plugins/chora-mc"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
max = 0
name = "construct: Event::SurfaceCreated (WM1c)"
paths = ["plugins/chora-construct"]
pattern = 'Event::SurfaceCreated\b'

[[row]]
allow = ["crates/chora-kit/"]
max = 8
name = "confirm.answer"
pattern = '"confirm\.answer"'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "fn language"
pattern = 'fn language\b'

[[row]]
allow = ["crates/chora-scene/", "crates/chora-kit/"]
max = 0
name = "XDG_RUNTIME_DIR (KIT1)"
pattern = 'XDG_RUNTIME_DIR'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "LC_ALL (KIT1)"
pattern = 'LC_ALL'

[[row]]
allow = ["crates/chora-kit/"]
max = 6
name = "UnixListener::bind in plugin tests"
paths = ["plugins"]
pattern = 'UnixListener::bind'

[[row]]
allow = ["crates/chora-kit/src/wm", "crates/chora-kit/tests/wm_"]
max = 18
name = "Command::Focus outside kit::wm"
pattern = 'Command::Focus\b'

# WM2: kit::wm::focus holds the focus of a look; tiling and mc moved.
[[row]]
max = 0
name = "own focus model (ShownFocus, WM2)"
paths = ["plugins"]
pattern = '\bShownFocus\b'

[[row]]
max = 2
name = "mc: Command::Focus (WM2)"
paths = ["plugins/chora-mc"]
pattern = 'Command::Focus\b'

[[row]]
max = 1
name = "tiling: Command::Focus (WM2)"
paths = ["plugins/chora-tiling"]
pattern = 'Command::Focus\b'

[[row]]
allow = ["crates/chora-kit/"]
max = 8
name = "Event::FocusChanged outside kit"
paths = ["plugins", "services"]
pattern = 'Event::FocusChanged\b'

# kit4: kit::ask is the only question model; mc and construct draw its card.
[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own question event model (Confirm, Keys)"
paths = ["plugins"]
pattern = '^\s*(pub )?struct (Confirm|Keys)\b'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "question buttons as literal Ja/Nein"
paths = ["plugins"]
pattern = '"(Ja|Nein)"'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own key cap of a question (cap, show_key copy)"
pattern = 'fn cap\(key: &str\)'

# kit6: kit::launch owns the start of a program and its end (D104); a
# plugin starts through it and keeps no token variable, pidfd or status file.
[[row]]
allow = ["crates/chora-kit/", "crates/choractl/"]
max = 0
name = "choractl run token variable (KIT6)"
pattern = 'CHORA_RUN_TOKEN'

[[row]]
allow = ["crates/chora-kit/"]
max = 0
name = "own end-of-program tracking (pidfd, status file) (KIT6)"
pattern = 'pidfd_open|chora-xp-exit|chora-launch-exit|struct StatusFile'

# kit2c: tiling binds the actions that every look has through kit::actions;
# its own enum keeps the windows, the layouts and the tags.
[[row]]
max = 0
name = "tiling: a shared action of its own (KIT2c)"
paths = ["plugins/chora-tiling"]
pattern = 'Action::(Run|Close|Give|Drag|Volume|ShowKeys)\b'
