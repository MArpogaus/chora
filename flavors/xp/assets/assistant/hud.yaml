hud: 1
font: Tahoma
panels:
- id: clip
  source: voice
  anchor: bottom_right
  margin: [8, 8]
  picture: paperclip.svg#{state}
  action: chat
- id: line
  source: say
  anchor: bottom_right
  margin: [96, 84]
  style: bubble
  text: '{text}'
  max_chars: 160
  action: chat
  tail: right
chat:
  style: bubble
  font: Tahoma
  size: 14
  anchor: bottom_right
  width: 340
  fill: [255, 255, 225]
  text: [0, 0, 0]
  name: [0, 60, 116]
  border: [0, 0, 0]
  idle_stop: grey
