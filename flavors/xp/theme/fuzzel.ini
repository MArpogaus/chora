# The Run box of the xp flavor: Tahoma, XP colors, opaque. chora-xp starts
# fuzzel with this file when the launcher of chora-xp.yaml is fuzzel.
[main]
font=Tahoma:pixelsize=14, DejaVu Sans:pixelsize=14
prompt="Open: "
width=34
lines=9
horizontal-pad=12
vertical-pad=12
inner-pad=8
# fuzzel reads line-height in points (96 dpi), the pads in pixels: 21 pt is
# the row of 28 px of xp-v2.md at scale 1 and 56 at scale 2 (28 pt were 37.3 px).
line-height=21
icons-enabled=no

[colors]
background=ece9d8ff
text=000000ff
prompt=000000ff
input=000000ff
match=003c74ff
selection=316ac5ff
selection-text=ffffffff
selection-match=ffffffff
border=0054e3ff

[border]
width=2
radius=0
