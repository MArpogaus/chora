# The notifications of the tiling flavor: an island in the palette, 12
# from the corner like a tile. Written by chora-tiling --apply-theme from
# the palette of chora-tiling.yaml.
font=Inter 14
layer=overlay
anchor=bottom-right
margin=12
padding=12
width=360
border-size=1
border-radius=10
icons=0
max-icon-size=0
default-timeout=10000
background-color=#1a1d27
text-color=#e6e8ef
border-color=#2e3344
progress-color=over #a78bfa

[urgency=high]
border-color=#f87171
default-timeout=0
