# The notifications of the tiling flavor: an island in the palette, above
# the dot of the helper and 12 inside the border of a tile. Written by
# chora-tiling --apply-theme from the palette of chora-tiling.yaml.
font=Inter 14
layer=overlay
anchor=bottom-right
margin=24,24,62,24
padding=12
width=360
border-size=1
border-radius=10
icons=0
default-timeout=10000
background-color=#1a1d27
text-color=#e6e8ef
border-color=#2e3344
progress-color=over #a78bfa

[mode=chat]
margin=24,424,62,24

[urgency=high]
border-color=#f87171
default-timeout=0
