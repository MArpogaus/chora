# The invariants and acts that fail on today's code (design 3.2 of the
# arch plan). A listed failure does not block the gate step `acts`; a
# listed pass blocks it, so the row goes in the merge that turns it
# green. Each row names the look, the id (an invariant such as `I1` or an
# act `act:NAME`), its finding id and the slice that turns it green. An
# optional `match` is a text that every breach of the cell must contain,
# so a row stays red only for the breach it names.
[[red]]
finding = "net3-m1: the key column of mc: the wrapped line of 'Start a program or run a command' overprints the next row 'Chat with a helper'"
id = "I5"
look = "mc"
match = "'Start a program or run a command'"
slice = "KIT3"

[[red]]
finding = "co-21: the cube held 2 s into a 4 s turn shows face 1 and no box for its neighbour face 0 (and face 3 beside face 2)"
id = "I13"
look = "construct"
match = "is missing beside"
slice = "WM6"

[[red]]
finding = "kit7-a1: after chat.show of the helper in mc the core focuses the page node of mc, and mc does not say in state.get that it holds the focus"
id = "I3"
look = "mc"
match = "in act 'the chat of the helper opens'"
slice = "WM2"

[[red]]
finding = "kit7-a2: in the construct, after a press on a pane and a new window, Tab opens no window list until a flight into a pane and back"
id = "act:Tab right after a new window opens the window list"
look = "construct"
match = "expected open ['construct-list'], got []"
slice = "WM2"

[[red]]
finding = "kit7-a2: in the construct, after a press on a pane and a new window, Tab opens no window list until a flight into a pane and back"
id = "I4"
look = "construct"
match = "in act 'Tab right after a new window opens the window list': construct-list was declared open and is not"
slice = "WM2"
