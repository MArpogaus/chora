# The invariants and acts that fail on today's code (design 3.2 of the
# arch plan). A listed failure does not block the gate step `acts`; a
# listed pass blocks it, so the row goes in the merge that turns it
# green. Each row names the look, the id (an invariant such as `I1` or an
# act `act:NAME`), its finding id and the slice that turns it green. The
# optional `act` (the act that first shows the breach), `capture` (the
# label of the node) and `match` (a text of the breach) name one fault:
# a breach that no row names blocks, and a row that no breach meets is
# stale and blocks too, unless it says `flaky = true` with an `act` and an
# `evidence` (two runs of that act, one with the fault and one without). A
# `capture` ending in `*` names every node label with that prefix, in every act.
# An `[[exempt]]` row (`look`, `node`, `reason`) passes the contrast breach of
# the nodes whose label starts with `node`, in every act, down to its `floor`.

