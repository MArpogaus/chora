# The settings of chora-mc. `chora-mc --print-config` prints this file.
# Copy it to ~/.config/chora/chora-mc.yaml and change it there, or change
# it with the method settings.set, which rewrites the file.

# The colors of the theme: light or dark.
theme: dark
# Each color is RGBA from 0 to 1.
themes:
  light:
    background: [0.95, 0.94, 0.91, 1.0]
    text: [0.13, 0.13, 0.13, 1.0]
    accent: [0.45, 0.45, 0.45, 1.0]
  dark:
    background: [0.07, 0.07, 0.07, 1.0]
    text: [0.86, 0.85, 0.82, 1.0]
    accent: [0.55, 0.55, 0.53, 1.0]
# The font of all text; the size of the lines in logical pixels. Titles
# are 1.5 times as large. Inter is in the Fedora package rsms-inter-fonts;
# without it, a system font shows.
font:
  family: Inter
  size: 20
# The scene at the start.
default_scene: agenda
# A binding and its action: next_scene, previous_scene, {scene: NAME}, or
# {run: COMMAND}, which starts a shell command; its window gets a scene of
# its own.
bindings:
  Super+Right: next_scene
  Super+Left: previous_scene
  Super+a: {scene: agenda}
  Super+space: {run: fuzzel}
