# The settings of chora-mc. `chora-mc --print-config` prints this file.
# Copy it to ~/.config/chora/chora-mc.yaml and change it there, or change
# it with the method settings.set, which rewrites the file. Edits by
# hand apply on the method settings.reload.

# The colors of the theme: light or dark.
theme: dark
# Each color is RGBA from 0 to 1. A style names a color of the theme;
# each theme needs a background.
themes:
  light:
    background: [0.97, 0.96, 0.93, 1.0]
    text: [0.16, 0.15, 0.14, 1.0]
    muted: [0.50, 0.48, 0.45, 1.0]
    faint: [0.83, 0.81, 0.77, 1.0]
    accent: [0.55, 0.14, 0.12, 1.0]
    green: [0.25, 0.46, 0.33, 1.0]
    amber: [0.72, 0.47, 0.08, 1.0]
    blue: [0.22, 0.38, 0.58, 1.0]
    red: [0.70, 0.13, 0.12, 1.0]
    magenta: [0.52, 0.25, 0.50, 1.0]
    cyan: [0.16, 0.46, 0.49, 1.0]
  dark:
    background: [0.11, 0.11, 0.11, 1.0]
    text: [0.85, 0.83, 0.79, 1.0]
    muted: [0.55, 0.54, 0.51, 1.0]
    faint: [0.26, 0.26, 0.25, 1.0]
    accent: [0.80, 0.47, 0.40, 1.0]
    green: [0.52, 0.72, 0.56, 1.0]
    amber: [0.88, 0.70, 0.38, 1.0]
    blue: [0.55, 0.69, 0.86, 1.0]
    red: [0.92, 0.42, 0.38, 1.0]
    magenta: [0.78, 0.58, 0.78, 1.0]
    cyan: [0.52, 0.76, 0.76, 1.0]
# The font sizes are steps of a modular scale: base times ratio to the
# power of the step. Each line of text is whole lines of the baseline grid.
scale:
  base: 18
  ratio: 1.333
  baseline: 27
# The styles of text. Each has a family, a weight (300 light, 400 normal,
# 700 bold), a style (normal or italic), a size in pixels, in em of
# scale.base or as a step of the scale, a color, a line_height, a
# letter_spacing in em, OpenType features (smcp small caps, c2sc
# capitals as small caps, onum old-style figures, tnum tabular figures)
# and uppercase. A style with a base changes it.
# TeX Gyre Pagella is in the Fedora package texlive-tex-gyre, outside the
# font directories. The RPM of chora adds that directory to fontconfig
# with /etc/fonts/conf.d/09-chora-tex-gyre.conf. Without the RPM, add
# /usr/share/texlive/texmf-dist/fonts/opentype/public/tex-gyre to
# CHORA_FONT_DIRS of chora. On Arch Linux, tex-gyre-fonts needs neither.
# Inter is in the package rsms-inter-fonts, on Arch Linux inter-font.
# Without a family, a system font shows.
# docs/mc-style.md has the rules that these styles follow.
styles:
  # Text to read: Pagella with old-style figures.
  body:
    family: TeX Gyre Pagella
    line_height: 1.5
    features: {onum: 1}
  # The title of a panel: spaced small caps, one step up, muted.
  heading:
    base: body
    step: 1
    line_height: 1.0
    color: muted
    letter_spacing: 0.06
    features: {smcp: 1, c2sc: 1, onum: 1}
  # The title of a scene: spaced capitals with lining figures, the one
  # accent of the page.
  chapter:
    base: body
    step: 3
    line_height: 1.2
    color: accent
    uppercase: true
    letter_spacing: 0.12
    features: {lnum: 1}
  # The number and the bar of the head, on the baseline of the title.
  chapter_number:
    base: chapter
    color: muted
    letter_spacing: 0
  # Machine data in a panel: hosts, loads, units.
  data:
    family: Inter
    line_height: 1.5
  # Labels of the regions: spaced capitals of Inter, as tall as the
  # lowercase of margin.
  running_head:
    family: Inter
    weight: 500
    em: 0.6112
    color: muted
    letter_spacing: 0.2
    uppercase: true
    features: {tnum: 1}
  # The lead of a scene: one step over the heading, at most one a page.
  lead:
    base: body
    step: 2
    line_height: 1.3
  # Notes in the margin, the regions and the HUD, with tabular figures.
  margin:
    family: Inter
    step: -1
    color: muted
    features: {tnum: 1}
  hud:
    base: margin
  mono:
    family: DejaVu Sans Mono
    step: -1
# The head of each scene: number ("3 | AGENDA" at the left edge of the
# text column: the number, a hairline bar and the title in spaced
# capitals, all on one baseline) or none.
chapter:
  layout: number
# The text block of every scene: the width of one column of the grid,
# the margin column left of each column for notes such as times, and the
# space between them, all in em of scale.base. All scenes share it, so
# the text and the head stay in place from scene to scene. A grid has 4
# columns and 3 rows; a scene file can set its own grid. On a narrow
# output fewer columns show; see min_panel.
page:
  measure: 18
  margin: 4
  gap: 1.5
# The least width and height of a panel, in em of scale.base. Where the
# columns of the grid would be narrower, the page shows fewer of them and
# the panels that do not fit wrap into new rows, in reading order; a row
# is never lower than the height. A page longer than the output scrolls
# with the wheel.
min_panel: [14, 8]
# New text writes itself: first its outline line by line, then its fill.
write:
  enabled: true
  duration_ms: 900
# The scene at the start.
default_scene: agenda
# The order of the scenes, and so their numbers. The scenes that the list
# leaves out, such as new ones and those of app.open, follow in the order
# they appear. The method scene.move changes the list.
order: [agenda, morning, agents, mission, terminal, overview]
# A binding and its action: next_scene, previous_scene, {scene: NAME},
# {run: COMMAND}, which starts a shell command whose window gets a scene
# of its own, {toggle: REGION}, which shows or hides a region; a docked
# app in it takes the focus first, the next press hides it, or
# {solo: {content: NAME, region: REGION}}, which shows the content alone
# in the region over any scene; the next press hides it again.
bindings:
  Super+Right: next_scene
  Super+Left: previous_scene
  Super+a: {scene: agenda}
  Super+o: {scene: overview}
  Super+space: {run: fuzzel}
  Super+Return: {toggle: drawer}
  Super+n: {toggle: right}
  Super+Up: {toggle: header}
  Super+Down: {toggle: footer}
  Super+F12: {solo: {content: overlay, region: drawer}}
# The states of an agent of agent.set: the sign and the color of each,
# and a label for the agents scene; without a label, the name.
states:
  idle: {sign: ○, color: faint}
  listening: {sign: ◉, color: blue}
  thinking: {sign: ◌, color: blue}
  working: {sign: ●, color: green}
  speaking: {sign: ◐, color: accent}
  question: {sign: '?', color: amber, label: has a question}
  blocked: {sign: ✕, color: red}
  done: {sign: ✓, color: green}
  asleep: {sign: ☾, color: faint}
# The regions around the page, as in the Emacs package auto-side-windows:
# a header and a footer line, sizes in lines of the baseline grid; a left
# and a right side, sizes in em; a drawer at the bottom, size in lines. A
# region shows only with something in it, and a scene file can show or
# hide one with `regions: {right: false}`.
regions:
  header: {shown: true, size: 2}
  footer: {shown: true, size: 2}
  left: {shown: false, size: 12}
  right: {shown: true, size: 13}
  drawer: {shown: false, size: 14}
# What the regions show, by name. Kinds: head (the running head of the
# scene), clock (a format of `date`), state and hud (the state and the
# words of the agent), agents (the sign and the name of each agent of
# agent.set, in the color of its state), text (lines of content.set and
# content.add, with a title), app (a command docked in a side or the
# drawer; {NAME} is the color NAME of the theme as RRGGBB; a scene's
# app: can name such a content). Each may set a style. notify.push fills
# the texts notify and urgent; urgent shows in the middle of the footer,
# where the header has no room left.
contents:
  head: {kind: head}
  clock: {kind: clock, format: '%A %-d %B  %H:%M'}
  date: {kind: clock, format: '%A %-d %B'}
  time: {kind: clock, format: '%H:%M'}
  state: {kind: state}
  hud: {kind: hud}
  agents: {kind: agents}
  notify: {kind: text, title: Notifications}
  urgent: {kind: text, style: {base: running_head, color: red}}
  # A spoken confirmation of voice.confirm, alone in the drawer.
  confirm: {kind: text, style: {base: mono}}
  overlay: {kind: text, title: Tests, style: {base: mono, color: muted}}
  next: {kind: text}
  notes: {kind: text, title: Notes}
  outline: {kind: text, title: Outline}
  # foot in the colors of the theme, also in the terminal scene. The
  # section colors-dark needs foot 1.26 or later.
  shell:
    kind: app
    command: >-
      foot -o pad=0x0
      -o colors-dark.background={background} -o colors-dark.foreground={text}
      -o 'colors-dark.cursor={background} {text}'
      -o colors-dark.selection-background={faint}
      -o colors-dark.selection-foreground={text}
      -o colors-dark.regular0={faint} -o colors-dark.bright0={muted}
      -o colors-dark.regular1={red} -o colors-dark.bright1={red}
      -o colors-dark.regular2={green} -o colors-dark.bright2={green}
      -o colors-dark.regular3={amber} -o colors-dark.bright3={amber}
      -o colors-dark.regular4={blue} -o colors-dark.bright4={blue}
      -o colors-dark.regular5={magenta} -o colors-dark.bright5={magenta}
      -o colors-dark.regular6={cyan} -o colors-dark.bright6={cyan}
      -o colors-dark.regular7={text} -o colors-dark.bright7={text}
# Which content goes where: the first rule that matches wins. A rule names
# a content or a kind, optionally the scenes (names, @app or @page), a
# region and a slot. In a line a slot below 0 goes left, 0 in the middle,
# above 0 right; elsewhere the lowest slot is on top.
rules:
- {content: head, region: header, slot: -1}
- {content: hud, scenes: ['@app'], region: header, slot: 0}
- {content: urgent, region: footer, slot: 0}
- {content: agents, region: header, slot: 1}
- {content: state, region: header, slot: 2}
- {content: clock, region: header, slot: 3}
- {content: hud, region: footer, slot: -1}
- {content: next, scenes: ['@page'], region: footer, slot: 1}
- {content: notes, region: right}
- {content: notify, region: right, slot: 1}
- {content: shell, region: drawer}
# The arrangement of the regions: a name of presets. A preset sets which
# regions show and its own rules; without rules, those above apply.
#   quiet:  the header alone, the words of the agent in its middle
#   desk:   header, footer with the HUD and the next entry, notes right
#   studio: an outline and the notes left, a terminal in the drawer
#   book:   running head and date above, the time as a folio below
preset: desk
presets:
  quiet:
    shown: {footer: false, right: false}
    rules:
    - {content: head, region: header, slot: -1}
    - {content: hud, region: header, slot: 0}
    - {content: urgent, region: header, slot: -2}
    - {content: agents, region: header, slot: 1}
    - {content: state, region: header, slot: 2}
    - {content: time, region: header, slot: 3}
  desk: {}
  studio:
    shown: {left: true, right: false, drawer: true}
    rules:
    - {content: head, region: header, slot: -1}
    - {content: hud, scenes: ['@app'], region: header, slot: 0}
    - {content: urgent, region: footer, slot: 0}
    - {content: agents, region: header, slot: 1}
    - {content: state, region: header, slot: 2}
    - {content: clock, region: header, slot: 3}
    - {content: hud, region: footer, slot: -1}
    - {content: next, scenes: ['@page'], region: footer, slot: 1}
    - {content: outline, region: left, slot: 0}
    - {content: notes, region: left, slot: 1}
    - {content: notify, region: left, slot: 2}
    - {content: shell, region: drawer}
  book:
    rules:
    - {content: head, region: header, slot: -1}
    - {content: urgent, region: footer, slot: 0}
    - {content: agents, region: header, slot: 1}
    - {content: date, region: header, slot: 2}
    - {content: hud, region: footer, slot: -1}
    - {content: time, region: footer, slot: 0}
    - {content: state, region: footer, slot: 1}
    - {content: notes, region: right}
    - {content: notify, region: right, slot: 1}
