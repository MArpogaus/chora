# The agents at work, one column each: the state in its color and sign,
# the task and the last words; a band below with the voice and the start.
# agent.set fills the panel agent-N with the N-th agent and band-N below
# it: more columns show more agents.
grid: [4, 3]
page: {measure: 24, margin: 0, gap: 1.5}
chapter: {title: Agents, layout: caps}
panels:
- {id: agent-1, cell: [0, 0, 1, 2]}
- {id: agent-2, cell: [1, 0, 1, 2], rule: faint}
- {id: agent-3, cell: [2, 0, 1, 2], rule: faint}
- {id: agent-4, cell: [3, 0, 1, 2], rule: faint}
- {id: band-1, cell: [0, 2, 1, 1], style: {base: margin}}
- {id: band-2, cell: [1, 2, 1, 1], rule: faint, style: {base: margin}}
- {id: band-3, cell: [2, 2, 1, 1], rule: faint, style: {base: margin}}
- {id: band-4, cell: [3, 2, 1, 1], rule: faint, style: {base: margin}}
