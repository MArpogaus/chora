# The machine as a calm page: load with a sparkline, busy processes,
# errors of the journal today, failed units and host facts. The collector
# collectors/system.py fills the panels every few seconds.
grid: [4, 2]
page: {measure: 21, margin: 6, gap: 1.5}
chapter: {title: Mission Control}
panels:
- {id: load, cell: [0, 0, 1, 1], title: Load, style: {family: Inter, features: {tnum: 1}}}
- {id: top, cell: [1, 0, 1, 1], title: Busy, rule: faint, style: {family: Inter, features: {tnum: 1}}}
- id: errors
  cell: [2, 0, 2, 1]
  title: Journal, errors today
  rule: faint
  title_style: {base: heading, color: red}
  style: {family: Inter, features: {tnum: 1}}
- {id: units, cell: [0, 1, 2, 1], title: Units, style: {family: Inter, features: {tnum: 1}}}
- {id: host, cell: [2, 1, 1, 1], title: Host, rule: faint, style: {family: Inter, features: {tnum: 1}}}
- id: read
  cell: [3, 1, 1, 1]
  title: Read from
  rule: faint
  style: {base: margin}
  lines:
  - /proc/stat, /proc/meminfo, /proc/net/dev
  - ps -eo comm,%cpu,rss --sort=-%cpu
  - journalctl -p err -b --since today -o json
  - systemctl --failed, systemctl --user --failed
