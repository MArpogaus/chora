# The settings of chora-xp. It lists every option. Copy it to
# ~/.config/chora/chora-xp.yaml and change it there, or change it with the
# method settings.set or the dialogs of chora-xp, which rewrite the file.
# Edits by hand apply on the method settings.reload or restart.

# The shell command of the terminal, for the Terminal of the start menu
# and the desktop files that need a terminal.
# For tests only: take the keys of input.inject as keys of the user. Off,
# the bindings ignore injected keys; keep it off outside tests.
test_accept_injected_keys: false
# The keys: a binding and its action. An action is one of every look
# (terminal, launcher, keys, chat, lock, power, screenshot, close,
# {volume: up|down|mute|{set: N}}, {cube: left|right} for a quarter turn of
# the cube) or one of xp: files (the file manager), desktop (show the
# desktop), tap (a key pressed and released alone opens the Start menu),
# start (opens the Start menu), {switch: next|previous} (Alt+Tab),
# {carry: left|right} (moves the focused window along with a turn of the
# cube) and cube (with a pointer button: the pointer turns the cube). A
# binding to an action that xp does not have (terminal, run, give, drag,
# desk) is dropped with a warning. When another client holds Ctrl+Alt+Left,
# Ctrl+Alt+Right, Ctrl+Alt+Shift+Left or Ctrl+Alt+Shift+Right, xp binds
# Super+Ctrl and the same arrow instead. The keys Super+Alt+1 to 4 give the
# focused window to another window manager and are not in this list.
bindings:
  Super+Super_L: tap
  Super+Super_R: tap
  Ctrl+Escape: start
  Super+d: desktop
  Super+space: launcher
  Super+F1: keys
  Super+slash: keys
  Super+Shift+Escape: lock
  Super+Shift+e: power
  Super+Print: screenshot
  Super+BTN_LEFT: cube
  Alt+F4: close
  Alt+Tab: {switch: next}
  Alt+Shift+Tab: {switch: previous}
  Super+e: files
  Super+a: chat
  XF86AudioRaiseVolume: {volume: up}
  XF86AudioLowerVolume: {volume: down}
  XF86AudioMute: {volume: mute}
  Ctrl+Alt+Left: {cube: left}
  Ctrl+Alt+Right: {cube: right}
  Ctrl+Alt+Shift+Left: {carry: left}
  Ctrl+Alt+Shift+Right: {carry: right}
terminal: foot
# The shell command of Run and of Super+Space, and of All Programs when no
# desktop file lists a program.
launcher: fuzzel
# The shell command of the file manager, for Super+e, the places of the
# start menu and the folders of the desktop; the folder follows it. When it
# is not installed, Super+e says so in a balloon.
file_manager: thunar
# The shell command of the plain text editor, Notepad of the start menu
# and of All Programs > Accessories. Notepad tries, in order, this
# command, lowriter, mousepad, gedit, gnome-text-editor, kwrite, kate,
# xed, pluma, featherpad, leafpad, l3afpad and geany; it skips what is
# not installed. A terminal editor (nano, vim) serves only when it is set
# here, for example "foot -e nano". When one does not open, the next
# starts and a notice names the one that serves and why the other did not;
# when none opens, a notice says so. Without any editor installed, Notepad
# says that no text editor is installed (for example mousepad).
editor:
# The programs of the start menu, at its top left below Terminal: the
# title, the shell command and the name of the icon.
programs: []
# The format of the clock of the taskbar, as in strftime.
clock_format: '%-I:%M %p'
# The background of the desktop, as Display Properties chooses it.
# picture: default (XP's Bliss when it is installed, else Bløff of the
# theme), none (the color only) or {file: /an/absolute/path}, a PNG, JPEG
# or SVG file. position: center, tile, stretch or fill. color: red, green
# and blue around a centered picture and without one.
wallpaper:
  picture: default
  position: fill
  color: [0, 78, 152]
# Taskbar and Start Menu Properties.
taskbar:
  locked: true
  auto_hide: false
  on_top: true
  clock: true
# The effects and sounds of Control Panel > Effects.
effects:
  wobbly: true
  lamp: true
  cube: true
  sounds: true
# The shell commands of the buttons of Turn Off and Log Off. Without a
# command (null), a button runs the shared power script, and Stand By is
# disabled.
session:
  turn_off:
  restart:
  stand_by: systemctl suspend
  log_off:
