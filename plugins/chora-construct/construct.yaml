# The settings of chora-construct. `chora-construct --print-config`
# prints this file. Copy it to ~/.config/chora/chora-construct.yaml and
# change it there, or change it with the method settings.set, which
# rewrites the file. Edits by hand apply on the method settings.reload.

# The construct that the flavor starts into, a file NAME.yaml in
# ~/.config/chora/constructs/; empty for an empty space.
start: ''
# The space: light (a pale sky over a warmer ground, a bright horizon)
# or dark (a black void over a dim ground, a faint horizon glow).
theme: light
# The leash: the walk slows near this radius around the start point and
# stops at it, in logical pixels.
radius: 6000
# How far ahead of the camera a new pane appears, in logical pixels. At
# about 0.65 times the width of the output a pane shows at 1:1.
pane_distance: 2000
# The keys in the space, by their keysym name, and what each does:
# forward, back, left, right (steps aside), turn_left, turn_right,
# look_up, look_down, home (back to the start point), fly_in (into the
# pane nearest the middle of the view), terminal (starts the terminal),
# launcher (starts the launcher), close (asks the window of the pane
# nearest the middle of the view to close), windows (opens and closes
# the window list), help (shows and hides the panel of the bindings),
# cube, chat (the chat with a helper), lock, power (the power menu),
# screenshot, volume_up, volume_down or mute. F1 is no binding: it
# reaches the program of a pane. The keys launcher, help, chat, lock,
# power, screenshot and the volume keys work in the walk and while the
# camera is in a pane. The space takes the keyboard, so the walk keys need no modifier. A key
# that starts or closes something names Super, as in Super+t, so that
# text typed into the space by mistake starts nothing; such text gets a
# short notice that the keys walk. Ctrl, Alt and Super come in that
# order, then Shift, as in Super+Shift+e. In the
# window list, Up and Down move the selection, Return chooses, and
# Escape or the windows key closes it.
keys:
  w: forward
  s: back
  a: left
  d: right
  Up: forward
  Down: back
  q: turn_left
  e: turn_right
  Left: turn_left
  Right: turn_right
  r: look_up
  f: look_down
  h: home
  Return: fly_in
  Super+t: terminal
  Super+space: launcher
  Super+x: close
  Tab: windows
  Super+F1: help
  Super+slash: help
  Super+c: cube
  Super+a: chat
  Super+Shift+Escape: lock
  Super+Shift+e: power
  Super+Print: screenshot
  XF86AudioRaiseVolume: volume_up
  XF86AudioLowerVolume: volume_down
  XF86AudioMute: mute
# The shell command of the key terminal; its window becomes a pane in
# the view direction.
# For tests only: take the keys of input.inject as keys of the user. Off,
# the bindings ignore injected keys; keep it off outside tests.
test_accept_injected_keys: false
terminal: foot -o pad=12x12
# The shell command of the key launcher. The launcher itself is no pane:
# a layer-shell launcher such as fuzzel shows over the space, and a
# window of a launcher shows in the middle of the output. The first
# window that it starts becomes a pane.
launcher: fuzzel
# The binding that flies out of a pane. The pane has the keyboard then,
# so this key is a grab, and a grab needs Ctrl, Alt or Super. Escape
# alone works after `choractl grant construct input.grab-any`.
fly_out: Alt+Escape
# The modifier that moves a pane: a drag with it held moves the pane
# under the pointer, and the wheel with it held resizes the pane. Ctrl,
# Alt, Shift or Super. A drop on a plugin pane gives the window to that
# plugin, and a drop on another output to its window manager.
modifier: Super
# The effects of the panes of own windows: [wobbly] bends a pane in 3D
# while the modifier drags it, and it shakes until it settles.
effects: []
# The window manager of the cube of `cube.open`, which adds
# `--output NAME` for each of its virtual outputs.
cube_manager: chora-xp
# Who draws the voice HUD at the bottom of the output (F28): the state of
# the voice agent, its spoken sentence and its questions. host: the HUD
# host chora-assistant with the folder plugins/chora-construct/hud, which
# every flavor starts; own: the construct, which hides the dot of the
# voice agent while it runs.
voice_hud: host
# The elements over the space: the voice HUD, the window list, the pane
# labels and the questions. docs/construct-style.md has the rules; run
# the contrast test after a change of a colour. Colours are RGB or RGBA,
# each from 0 to 1.
style:
  # The spacing unit, the corner radius of a panel and the reach of its
  # glow, in logical pixels.
  unit: 8
  radius: 12
  glow: 16
  # The family of labels and text, and the family of data.
  font: Inter
  mono: DejaVu Sans Mono
  # The one accent of both themes: the state ring, the waveform, the
  # selection mark and the glow. It never colours text.
  accent: [0.149, 0.502, 0.706]
  # Per theme: the fill of a panel, its hairline, the text, the muted
  # labels and notes, and the alpha of the accent in the glow.
  themes:
    light:
      glass: [1.00, 0.99, 0.975, 0.94]
      edge: [0.08, 0.09, 0.12, 0.24]
      text: [0.08, 0.09, 0.12]
      muted: [0.29, 0.32, 0.38]
      glow: 0.10
    dark:
      glass: [0.04, 0.05, 0.07, 0.86]
      edge: [1.00, 1.00, 1.00, 0.16]
      text: [0.93, 0.93, 0.95]
      muted: [0.64, 0.67, 0.71]
      glow: 0.22
