hud: 1
font: Inter
panels:
- id: ring
  source: voice
  anchor: top
  margin: [0, 32]
  picture: ring.svg#{state}
  action: mute
- id: line
  source: say
  near: ring
  style: bubble
  text: '{text}'
  max_chars: 160
- id: chips
  source: agents
  anchor: top
  margin: [0, 104]
  style: bubble
  rows: '{name} · {state}'
  max_rows: 4
  action: chat
chat:
  style: glass
  font: Inter
  size: 16
  anchor: right
  width: 480
  fill: [240, 237, 234]
  text: [20, 23, 31]
  name: [74, 82, 97]
  border: [187, 186, 185]
