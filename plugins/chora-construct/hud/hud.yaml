hud: 1
font: Inter
panels:
- id: ring
  source: voice
  anchor: top
  margin: [0, 32]
  picture: ring.svg#{state}
  text: '{state}'
  action: mute
- id: line
  source: say
  near: ring
  style: bubble
  text: '{text}'
  max_chars: 160
- id: chips
  source: agents
  anchor: top_left
  margin: [32, 32]
  style: bubble
  rows: '{name} · {state}'
  max_rows: 4
  action: chat
  fill: [255, 252, 249]
  border: [187, 186, 185]
chat:
  style: glass
  font: Inter
  size: 16
  anchor: right
  width: 480
  margin: 32
  fill: [255, 252, 249]
  text: [20, 23, 31]
  name: [74, 82, 97]
  border: [20, 23, 31]
  glow: [38, 128, 181]
dark:
  chat:
    fill: [10, 13, 18]
    text: [237, 237, 242]
    name: [163, 171, 181]
    border: [237, 237, 242]
  panels:
    line:
      fill: [10, 13, 18]
      border: [90, 94, 102]
      colours:
        text: [237, 237, 242]
    chips:
      fill: [10, 13, 18]
      border: [90, 94, 102]
      colours:
        text: [237, 237, 242]
