# A mic source without the sound of the speakers, for the voice agent.
# monitor.mode takes the reference from the default output, so the
# agent plays through the normal output and records from this source.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            # Keys of spa/plugins/aec/aec-webrtc.cpp. With the defaults
            # the user's speech came out at -80 dBFS with digital zero
            # between words (live test 2026-10-31). The digital AGC
            # lifts the speech; the noise suppression (level high) is
            # off, because Silero and the ASR handle noise.
            aec.args = {
                webrtc.gain_control = true
                webrtc.noise_suppression = false
            }
            capture.props = { node.name = "echo-cancel-capture" }
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo-cancelled mic"
            }
        }
    }
]
