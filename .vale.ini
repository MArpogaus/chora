# Prose rules of the project (Simplified Technical English). See .vale/.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[docs/*.md]
BasedOnStyles = Chora
# Tables are not prose. Code blocks are skipped by default.
BlockIgnores = (?m)^\|.*$
# Spoken phrases of the voice agent are in quotes.
TokenIgnores = ("[^"]*"), (“[^”]*”)
