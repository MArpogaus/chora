<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- TeX Gyre Pagella for chora-mc: Fedora's texlive-tex-gyre installs the
     OpenType files outside the font directories. chora reads this file
     too, through /etc/fonts/fonts.conf and conf.d. -->
<fontconfig>
  <dir>/usr/share/texlive/texmf-dist/fonts/opentype/public/tex-gyre</dir>
</fontconfig>
