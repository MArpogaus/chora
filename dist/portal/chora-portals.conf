# The portals of a chora session (D37). xdg-desktop-portal reads this file
# when XDG_CURRENT_DESKTOP is chora: screen sharing and screenshots go
# through xdg-desktop-portal-wlr, the other portals through the GTK one.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# The inhibit portal of GTK works only in GNOME.
org.freedesktop.impl.portal.Inhibit=none
