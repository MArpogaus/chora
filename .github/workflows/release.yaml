# An annotated tag vX.Y.Z on a merge commit of main releases the version
# of Cargo.toml. The release waits for a green CI run of the same commit.
# It builds the RPM in Fedora 44 and the package for Arch Linux (see
# packages.yaml), installs each once as a check, and attaches them with
# their SHA256 sums to a GitHub release. Versions below 1.0 and release
# candidates are pre-releases. One release runs at a time. Only the short last job holds
# a write token; the build runs the build scripts of all dependencies with
# a read token.
name: release

on:
  push:
    tags: [v*]

permissions: {}

# Runs wait for each other, so that the second one sees the release of the
# first one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: the tag matches Cargo.toml, is annotated, and is on a merge commit of main
      id: tag
      run: |
        set -euo pipefail
        tag=$GITHUB_REF_NAME
        # The checkout can leave a lightweight tag. Fetch the tag object again.
        git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
        version=$(sed -n 's/^version = "\(.*\)"/v\1/p' Cargo.toml | head -1)
        test "$tag" = "$version" || { echo "$tag is not the version $version"; exit 1; }
        test "$(git cat-file -t "refs/tags/$tag")" = tag || { echo "$tag is not annotated"; exit 1; }
        parents=$(git rev-list --parents -n 1 "$GITHUB_SHA" | wc -w)
        test "$parents" -ge 3 || { echo "$tag is not on a merge commit"; exit 1; }
        # A commit of main itself, not a merge inside dev.
        git rev-list --first-parent origin/main | grep -x "$GITHUB_SHA" >/dev/null ||
          { echo "$tag is not on a commit of main"; exit 1; }
        echo "tag=$tag" >>"$GITHUB_OUTPUT"
    - name: the version has no release yet
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag.outputs.tag }}
      run: |
        # Only a 404 means no release; another error of the API fails.
        if answer=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
          echo "$TAG has a release already"
          exit 1
        fi
        echo "$answer" | grep -q "HTTP 404" || { echo "$answer" >&2; exit 1; }
    - name: CI of the commit is green
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&event=push"
        for _ in $(seq 100); do
          # After a failed API call, the loop tries again.
          if answer=$(gh api "$runs" --jq '.workflow_runs[0] | "\(.status // "none") \(.conclusion // "none")"'); then
            read -r status conclusion <<<"$answer"
            case "$status" in
              completed) test "$conclusion" = success || { echo "CI is $conclusion"; exit 1; }; exit 0 ;;
            esac
          fi
          sleep 30
        done
        echo "CI did not finish"
        exit 1

  packages:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/packages.yaml

  release:
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
      with:
        name: rpm
        path: rpm
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
      with:
        name: arch
        path: arch
    - name: create the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ needs.version.outputs.tag }}
      run: |
        set -euo pipefail
        # A tag that moved during the build would get assets of another commit.
        now=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
        test "$now" = "$GITHUB_SHA" || { echo "$TAG moved to $now"; exit 1; }
        prerelease=()
        case "$TAG" in v0.*|*-*) prerelease=(--prerelease) ;; esac
        cat rpm/SHA256SUMS arch/SHA256SUMS >SHA256SUMS
        gh release create "$TAG" rpm/*.rpm arch/*.pkg.tar.zst SHA256SUMS \
          --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag \
          --notes "See CHANGELOG.md for this release." "${prerelease[@]}"
