# Lint and test in the Fedora 44 container that also builds the release, so
# CI checks the same system libraries. The check job uses the toolchain of
# rust-toolchain.toml. The msrv job uses the minimum Rust version of
# Cargo.toml. The e2e job uses the Rust of Fedora, which also builds the
# release. It runs tests/nested.sh, the nested core, tests/xp.sh, the XP
# flavor, and tests/agent.sh, the agent interface.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The pixel tests render on the software driver of Mesa.
    - run: xargs dnf install -y rustup mesa-dri-drivers < dist/fedora-build-requires.txt
    # rustup takes the toolchain of rust-toolchain.toml.
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - run: cargo test --workspace --locked
    # Gate check 9 of 0.7: every error code of docs/api.md has a test.
    # cargo test above also runs the test of gate check 7.
    - run: tests/gate-0.7-9.sh
    # Gate checks 5 and 8 of 0.8: the unit tests of the sequence numbers
    # and of the revoke binding.
    - run: tests/gate-0.8-5.sh
    - run: tests/gate-0.8-8.sh
    # The grep of gate check 1 of 0.8: plugins leave the connection to
    # the runtime of chora-kit.
    - run: tests/gate-0.8-plugin-runtime.sh

  # The minimum Rust version of Cargo.toml builds the workspace.
  msrv:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y rustup < dist/fedora-build-requires.txt
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - name: check with the minimum Rust version
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
        rustup toolchain install "$msrv" --profile minimal
        cargo "+$msrv" check --workspace --all-targets --locked

  e2e:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y sway foot grim jq gawk mesa-dri-drivers procps-ng python3 thunar waybar fuzzel wlrctl swaylock wlr-randr dbus-daemon google-noto-sans-cjk-vf-fonts twitter-twemoji-fonts < dist/fedora-build-requires.txt
    # The file capabilities of the packaged sway fail in a container; a
    # copy without them runs.
    - run: install -m755 /usr/bin/sway /usr/local/bin/sway
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --workspace --locked
    - run: tests/nested.sh target/debug e2e
    - run: tests/xp.sh target/debug e2e/xp
    - run: tests/agent.sh target/debug e2e/agent
    # Gate checks 6, 10 and 8 (without a user manager) of 0.7.
    - run: tests/gate-0.7-6.sh
    - run: tests/gate-0.7-10.sh
    - run: tests/gate-0.7-8.sh
    # Gate checks of 0.8; 5 and 8 run in the check job. Checks 9 and 10
    # take the CJK and emoji fonts from the directory of tests/gate-0.8-9.sh.
    - run: |
        mkdir -p ~/.local/share/fonts/chora-test
        ln -s /usr/share/fonts/google-noto-sans-cjk-vf-fonts/NotoSansCJK-VF.ttc \
            /usr/share/fonts/twemoji/Twemoji.ttf ~/.local/share/fonts/chora-test/
    - run: tests/gate-0.8-1.sh
    - run: tests/gate-0.8-2.sh
    - run: tests/gate-0.8-3.sh
    - run: tests/gate-0.8-4.sh
    - run: tests/gate-0.8-6.sh
    - run: tests/gate-0.8-7.sh
    - run: tests/gate-0.8-9.sh
    - run: tests/gate-0.8-10.sh
    # Gate check 6 of the 0.8 gate itself (D62, #99).
    - run: tests/gate-0.8-tiling-style.sh
    - run: tests/gate-0.8-xp-token.sh e2e/xp
    # Gate check 4 of the 0.8 gate itself (D62).
    - run: tests/gate-0.8-xp-settings.sh
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: e2e-logs
        path: e2e

  # Gate check 4 of 0.7: a Podman container that mounts only the client
  # directory of agent queries the scene and draws a node. Podman is
  # preinstalled on the ubuntu runner. The binaries are built there, not
  # in the Fedora container of the other jobs, so the native libraries
  # of the core come from apt.
  podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The equivalents of dist/fedora-build-requires.txt.
    - run: |
        sudo apt-get update
        sudo apt-get install -y libdisplay-info-dev libdrm-dev libinput-dev \
            libseat-dev libsystemd-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgbm-dev
        # The software EGL device of the headless core, as mesa-dri-drivers
        # in the Fedora jobs.
        sudo apt-get install -y libegl-mesa0 libgl1-mesa-dri
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --locked -p chora -p choractl
    - run: tests/gate-0.7-4.sh

  # Gate check 3 of 0.7: chora on the tty backend with the vkms card. The
  # azure kernel of the runner has vkms. The card of Hyper-V goes, so that
  # vkms is the only card. seatd gives root the seat.
  vkms:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The equivalents of dist/fedora-build-requires.txt, as in the podman job.
    - run: |
        sudo apt-get update
        sudo apt-get install -y libdisplay-info-dev libdrm-dev libinput-dev \
            libseat-dev libsystemd-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgbm-dev \
            libegl-mesa0 libgl1-mesa-dri seatd foot
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --locked -p chora -p choractl -p chora-tiling
    - run: |
        sudo modprobe vkms
        for dev in /sys/bus/vmbus/drivers/hyperv_drm/*-*; do
            basename "$dev" | sudo tee /sys/bus/vmbus/drivers/hyperv_drm/unbind
        done
        ls -l /dev/dri
    - run: |
        sudo seatd -g root &
        sleep 1
        sudo LIBSEAT_BACKEND=seatd BIN="$PWD/target/debug" tests/gate-0.7-3.sh

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25   # v2.1.1
