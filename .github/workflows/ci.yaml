# Lint and test in the Fedora 44 container that also builds the release, so
# CI checks the same system libraries. The check job uses the toolchain of
# rust-toolchain.toml. The msrv job uses the minimum Rust version of
# Cargo.toml. The e2e job uses the Rust of Fedora, which also builds the
# release. It runs tests/nested.sh, the nested core, tests/xp.sh, the XP
# flavor, and tests/agent.sh, the agent interface.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The pixel tests render on the software driver of Mesa.
    - run: xargs dnf install -y rustup mesa-dri-drivers < dist/fedora-build-requires.txt
    # rustup takes the toolchain of rust-toolchain.toml.
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - run: cargo test --workspace --locked

  # The minimum Rust version of Cargo.toml builds the workspace.
  msrv:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y rustup < dist/fedora-build-requires.txt
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - name: check with the minimum Rust version
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
        rustup toolchain install "$msrv" --profile minimal
        cargo "+$msrv" check --workspace --all-targets --locked

  e2e:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y sway foot grim jq gawk mesa-dri-drivers procps-ng python3 waybar fuzzel wlrctl swaylock wlr-randr dbus-daemon < dist/fedora-build-requires.txt
    # The file capabilities of the packaged sway fail in a container; a
    # copy without them runs.
    - run: install -m755 /usr/bin/sway /usr/local/bin/sway
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --workspace --locked
    - run: tests/legacy-callers.sh
    - run: tests/nested.sh target/debug e2e
    - run: tests/xp.sh target/debug e2e/xp
    - run: tests/agent.sh target/debug e2e/agent
    - if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: e2e-logs
        path: e2e

  # Gate check 4 of 0.7: a Podman container that mounts only the client
  # directory of agent queries the scene and draws a node. Podman is
  # preinstalled on the ubuntu runner. The binaries are built there, not
  # in the Fedora container of the other jobs, so the native libraries
  # of the core come from apt.
  podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The equivalents of dist/fedora-build-requires.txt.
    - run: |
        sudo apt-get update
        sudo apt-get install -y libdisplay-info-dev libdrm-dev libinput-dev \
            libseat-dev libsystemd-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgbm-dev
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --locked -p chora -p choractl
    - run: tests/gate-0.7-4.sh

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25   # v2.1.1
