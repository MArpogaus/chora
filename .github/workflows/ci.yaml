# Lint and test in the Fedora 44 container that also builds the release, so
# CI checks the same system libraries. The check job uses the toolchain of
# rust-toolchain.toml. The msrv job uses the minimum Rust version of
# Cargo.toml. The e2e job uses the Rust of Fedora, which also builds the
# release. It runs tests/nested.sh, the nested core, tests/xp.sh, the XP
# flavor, and tests/agent.sh, the agent interface.
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The pixel tests render on the software driver of Mesa.
    - run: xargs dnf install -y rustup mesa-dri-drivers git < dist/fedora-build-requires.txt
    # rustup takes the toolchain of rust-toolchain.toml.
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68   # v2.88.1
      with:
        tool: nextest
    # It also checks that the core forks no process but the startup
    # command. .config/nextest.toml ends a hung test after 2 minutes.
    - run: cargo nextest run --workspace --locked --profile ci
    # nextest does not run doctests.
    - run: cargo test --doc --workspace --locked
    # Clippy does not run the rustdoc lints, such as broken links.
    - run: cargo doc --workspace --no-deps --locked
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: nextest-junit
        path: target/nextest/ci/junit.xml
        if-no-files-found: ignore
    - name: each error code of docs/api.md has a test
      run: tests/gate-0.7-9.sh
    - name: a subscription misses no event and sees none twice
      run: tests/gate-0.8-5.sh
    - name: the revoke binding removes the capabilities of all clients
      run: tests/gate-0.8-8.sh
    - name: plugins leave the connection to the runtime of chora-kit
      run: tests/gate-0.8-plugin-runtime.sh

  # The line coverage of the unit tests, without a threshold. The job
  # summary shows it per crate; lcov.info is an artifact.
  coverage:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y rustup mesa-dri-drivers git jq < dist/fedora-build-requires.txt
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - run: rustup component add llvm-tools
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68   # v2.88.1
      with:
        tool: cargo-llvm-cov@0.8.7,nextest
    - run: cargo llvm-cov nextest --workspace --locked --profile ci --no-report
    - run: cargo llvm-cov report --lcov --output-path lcov.info
    - run: cargo llvm-cov report --json --summary-only --output-path coverage.json
    - run: tests/coverage-summary.sh coverage.json >>"$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: lcov
        path: lcov.info

  # The minimum Rust version of Cargo.toml builds the workspace.
  msrv:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y rustup < dist/fedora-build-requires.txt
    - run: rustup-init -y --profile minimal --default-toolchain none
    - run: echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
    - name: check with the minimum Rust version
      run: |
        msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
        rustup toolchain install "$msrv" --profile minimal
        cargo "+$msrv" check --workspace --all-targets --locked

  e2e:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y sway foot grim jq gawk mesa-dri-drivers procps-ng python3 thunar waybar fuzzel wlrctl swaylock wlr-randr dbus-daemon mako swaybg swayidle kanshi systemd desktop-file-utils google-noto-sans-cjk-vf-fonts twitter-twemoji-fonts xdg-desktop-portal xdg-desktop-portal-wlr pipewire python3-gobject-base xwayland-satellite xorg-x11-server-Xwayland xeyes < dist/fedora-build-requires.txt
    # The file capabilities of the packaged sway fail in a container; a
    # copy without them runs.
    - run: install -m755 /usr/bin/sway /usr/local/bin/sway
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --workspace --locked
    - name: the units of the session and the flavors are valid
      run: tests/gate-0.9-session-units.sh
    - name: the watchdog thread logs a shader hang and aborts the core
      run: tests/gate-0.9-shader-hang.sh
    - name: a view sets tap and key repeat, and a client gets repeat_info
      run: tests/gate-0.9-input.sh
    - run: tests/nested.sh target/debug e2e
    - run: tests/xp.sh target/debug e2e/xp
    - run: tests/agent.sh target/debug e2e/agent
    - name: a client with input.grab-any grabs keys, one without it fails
      run: tests/gate-0.7-6.sh
    - name: the battle workflows pass without pixel clicks
      run: tests/gate-0.7-10.sh
    - name: choractl run without a user manager passes the activation token
      run: tests/gate-0.7-8.sh
    # The text checks take the CJK and emoji fonts from the directory of
    # tests/gate-0.8-9.sh.
    - name: fonts for the text checks
      run: |
        mkdir -p ~/.local/share/fonts/chora-test
        ln -s /usr/share/fonts/google-noto-sans-cjk-vf-fonts/NotoSansCJK-VF.ttc \
            /usr/share/fonts/twemoji/Twemoji.ttf ~/.local/share/fonts/chora-test/
    - name: an MCP client focuses and moves a tiling window
      run: tests/gate-0.8-1.sh
    - name: MCP clicks under a camera with pan and zoom hit the node
      run: tests/gate-0.8-2.sh
    - name: wait_events runs beside other calls and ends on a cancel
      run: tests/gate-0.8-3.sh
    - name: injected text appears unchanged in foot
      run: tests/gate-0.8-4.sh
    - name: the MCP tool list follows the exported methods
      run: tests/gate-0.8-6.sh
    - name: a capture shows the mark while a client injects input
      run: tests/gate-0.8-7.sh
    - name: a text node shows fallback fonts
      run: tests/gate-0.8-9.sh
    - name: an MCP client puts a text node on a screen
      run: tests/gate-0.8-10.sh
    - name: settings.set changes the style of new tiling windows
      run: tests/gate-0.8-tiling-style.sh
    - name: a requested opacity of a tiling window stays
      run: tests/gate-0.8-tiling-look.sh
    - name: get_tags and the tags module of waybar follow a window
      run: tests/gate-0.9-tiling-tags.sh
    - name: the portal shares an output through xdg-desktop-portal-wlr
      run: tests/gate-0.9-screencast.sh
    - name: an X11 program through xwayland-satellite is a tiled surface
      run: tests/gate-0.9-x11.sh
    - name: the file manager of the XP start menu gets its activation token
      run: tests/gate-0.8-xp-token.sh e2e/xp
    - name: settings.set changes the XP wallpaper and saves it
      run: tests/gate-0.8-xp-settings.sh
    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: e2e-logs
        path: e2e

  # A Podman container that mounts only the client directory of agent
  # queries the scene and draws a node. Podman is preinstalled on the
  # ubuntu runner. The binaries are built there, not in the Fedora
  # container of the other jobs, so the native libraries of the core come
  # from apt.
  podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The equivalents of dist/fedora-build-requires.txt.
    - run: |
        sudo apt-get update
        sudo apt-get install -y libdisplay-info-dev libdrm-dev libinput-dev \
            libseat-dev libsystemd-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgbm-dev
        # The software EGL device of the headless core, as mesa-dri-drivers
        # in the Fedora jobs.
        sudo apt-get install -y libegl-mesa0 libgl1-mesa-dri
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --locked -p chora -p choractl
    - run: tests/gate-0.7-4.sh

  # chora on the tty backend with the vkms card. The azure kernel of the
  # runner has vkms. The card of Hyper-V goes, so that vkms is the only
  # card. seatd gives root the seat.
  vkms:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    # The equivalents of dist/fedora-build-requires.txt, as in the podman job.
    - run: |
        sudo apt-get update
        sudo apt-get install -y libdisplay-info-dev libdrm-dev libinput-dev \
            libseat-dev libsystemd-dev libudev-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libgbm-dev \
            libegl-mesa0 libgl1-mesa-dri seatd foot
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
    - run: cargo build --locked -p chora -p choractl -p chora-tiling -p chora-probe
    - run: |
        sudo modprobe vkms
        uname -r
        ls /sys/kernel/config/vkms || true
        for dev in /sys/bus/vmbus/drivers/hyperv_drm/*-*; do
            basename "$dev" | sudo tee /sys/bus/vmbus/drivers/hyperv_drm/unbind
        done
        ls -l /dev/dri
    - run: |
        sudo seatd -g root &
        sleep 1
        sudo LIBSEAT_BACKEND=seatd BIN="$PWD/target/debug" tests/gate-0.7-3.sh
    - name: a second output plugs in and out (0.9 gate 5)
      run: |
        sudo LIBSEAT_BACKEND=seatd BIN="$PWD/target/debug" SHOTS="$PWD/hotplug" \
            tests/gate-0.9-vkms-hotplug.sh
    - if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: vkms-hotplug
        path: hotplug

  deny:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25   # v2.1.1
    # An unused dependency fails the job. A false positive goes into
    # [package.metadata.cargo-machete] of its Cargo.toml.
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68   # v2.88.1
      with:
        tool: cargo-machete
    - run: cargo machete
