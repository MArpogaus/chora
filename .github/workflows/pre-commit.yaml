name: pre-commit

on: [push]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # vale-action reports as a check
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
      with:
        python-version: '3.12'
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd   # v3.0.1
      env:
        SKIP: cargo-clippy,lychee,vale   # clippy needs the system libraries (ci.yaml runs it in Fedora); lychee and vale run below
    - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8   # v2.9.0
      with:
        args: --config lychee.toml docs README.md plans
    - uses: errata-ai/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff   # v3.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: docs
        fail_on_error: true
        vale_flags: --minAlertLevel=error
