# The RPM for Fedora 44 and the package for Arch Linux, each built and
# installed once as a smoke check. The release workflow calls it before it
# publishes; a pull request to dev runs it alone, so that the CI PR proves
# the packages. It publishes nothing and holds a read token only.
name: packages

on:
  workflow_call:
  pull_request:
    branches: [dev]

permissions: {}

jobs:
  rpm:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44@sha256:52740d9b1b9d04f1b325ef9625361b3260e992c84b1fe693365f6a188358e5ca
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - run: xargs dnf install -y rpm-build < dist/fedora-build-requires.txt
    - run: cargo install --locked cargo-generate-rpm@0.21.0
    - run: PATH="$HOME/.cargo/bin:$PATH" dist/build-rpm.sh target/rpm
    - name: install the package once
      run: |
        dnf install -y target/rpm/*.rpm
        chora --version
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: rpm
        path: target/rpm/

  arch:
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest@sha256:5bf8d86cc2bc6a8406b5cefc7cbafb185202f8fa5faae5ef5e6e9b2424ca42a8
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: install the build dependencies
      run: |
        # An old image lacks new packager keys. Update the keyring first.
        pacman -Sy --noconfirm archlinux-keyring
        pacman -Su --noconfirm --needed base-devel cargo pkgconf libdisplay-info \
          libdrm libinput libxkbcommon mesa seatd systemd-libs wayland
    # makepkg refuses to run as root.
    - run: useradd -m builder && chown -R builder .
    - run: su builder -c 'dist/build-arch.sh target/arch'
    - name: install the package once
      run: |
        pacman -U --noconfirm target/arch/*.pkg.tar.zst
        chora --version
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
      with:
        name: arch
        path: target/arch/
