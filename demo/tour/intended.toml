# Intended changes of tour v9 against the v8 replay (design/tour-v9.md section 6).
# One [[change]] per act and kind of diff that is meant: act (the id of the act:
# the scene id of design/tour-v9.md that the chapter gives it with `scene=`, `h2`; a later act of the
# scene has a letter, `h1b`), kind (rect, visible, meta, owner, missing, added, z-order, pixel, or * for any), cause (a commit or a finding id).
# `baseline_none = ["<act>.<capture>"]` lists the captures that have no v8 baseline by design;
# any other absence in BASE is a regression. A check that is red on purpose has a row of kind check.
# A v8 open row that is gone in v9 needs a row here too. tests/tour-diff.py reads it with
# --intended; a diff with no row is a regression.

# 733967aa cannot run these: the replay of the handover chapter stops at handover.py:190, where
# the row `xp-ctx-1-0` (the Send To row of the xp context menu, xp-give 22fead94) does not exist,
# so no capture from the Send To act on was taken there (record-v9 r1).
baseline_none = ["h2.Q", "h3.Q", "h3b.Q", "h4.Q", "h5.H50", "h6.Q", "h7.Q"]

[[change]]
act = "h2"
cause = "xp-give Send To row (22fead94)"
kind = "meta"

[[change]]
act = "h2"
cause = "xp-give Send To row (22fead94)"
kind = "rect"

[[change]]
act = "h2"
cause = "xp-give Send To row (22fead94)"
kind = "added"
